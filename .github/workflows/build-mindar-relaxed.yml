name: Build MindAR relaxed matching test bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mindar-relaxed.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout MindAR 1.2.5 source
        run: git clone --depth 1 --branch v1.2.5 https://github.com/hiukim/mind-ar-js.git mindar-src

      - name: Patch matching thresholds
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mindar-src/src/image-target/matching/matching.js')
          s = p.read_text()
          replacements = {
              'const HAMMING_THRESHOLD = 0.7;': 'const HAMMING_THRESHOLD = 0.8;',
              'const MIN_NUM_INLIERS = 6;': 'const MIN_NUM_INLIERS = 5;',
              'const INLIER_THRESHOLD = 3;': 'const INLIER_THRESHOLD = 4;',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected line not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mindar-src/package-lock.json

      - name: Install and build MindAR
        working-directory: mindar-src
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Copy custom bundle and runtime chunks
        run: |
          rm -rf vendor/relaxed
          mkdir -p vendor/relaxed
          cp mindar-src/dist/*.js vendor/relaxed/

      - name: Commit custom test bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/relaxed/
          if git diff --cached --quiet; then
            echo "No bundle changes"
            exit 0
          fi
          git commit -m "Build MindAR relaxed matching test bundle"
          git push
