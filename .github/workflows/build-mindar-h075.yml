name: Build MindAR Hamming 0.75 test bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mindar-h075.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout MindAR 1.2.5 source
        run: git clone --depth 1 --branch v1.2.5 https://github.com/hiukim/mind-ar-js.git mindar-src

      - name: Patch Hamming threshold to 0.75
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mindar-src/src/image-target/matching/matching.js')
          s = p.read_text()
          old = 'const HAMMING_THRESHOLD = 0.7;'
          new = 'const HAMMING_THRESHOLD = 0.75;'
          if old not in s:
              raise SystemExit('Expected HAMMING_THRESHOLD line not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mindar-src/package-lock.json

      - name: Install and build MindAR
        working-directory: mindar-src
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Copy custom bundle and runtime chunks
        run: |
          rm -rf vendor/h075
          mkdir -p vendor/h075
          cp mindar-src/dist/*.js vendor/h075/

      - name: Commit custom test bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/h075/
          if git diff --cached --quiet; then
            echo "No bundle changes"
            exit 0
          fi
          git commit -m "Build MindAR test bundle with Hamming 0.75"
          git push
