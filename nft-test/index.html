<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AR.js NFT Test</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar-nft.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #status {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
    }

    #status.found {
      font-size: 28px;
    }
  </style>
</head>

<body>
  <div id="status">NFTデータ読み込み中…</div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-nft
      id="nft-target"
      type="nft"
      url="../assets/nft-test/02"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    ></a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById('status');
    const target = document.getElementById('nft-target');

    window.addEventListener('arjs-nft-loaded', () => {
      status.textContent = '2番画像をかざしてください';
    });

    target.addEventListener('markerFound', () => {
      status.textContent = 'FOUND';
      status.classList.add('found');
    });

    target.addEventListener('markerLost', () => {
      status.textContent = '2番画像をかざしてください';
      status.classList.remove('found');
    });

    window.addEventListener('camera-error', () => {
      status.textContent = 'カメラ起動エラー';
      status.classList.remove('found');
    });
  </script>
</body>
</html>
